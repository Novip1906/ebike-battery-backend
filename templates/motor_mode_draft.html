<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавление режима работы мотора</title>
    <link rel="stylesheet" href="/static/css/motor_mode.css">
</head>
<body class="screen screen--draft">
<main class="draft">
    <header class="draft__header">
        <h1 class="draft__title">Новый режим работы мотора</h1>
        <span class="status status--draft">{{ .MotorMode.Status }}</span>
    </header>

    <form class="draft__form">
        <section class="draft__section">
            <h2 class="draft__section-title">Медиа режима</h2>

            <label class="field">
                <span class="field__label">Ключ изображения в Minio</span>
                <input class="field__input" type="text" name="image_key" value="{{ .MotorMode.ImageKey }}">
            </label>
            <img class="draft__preview" src="{{ .MediaBaseURL }}/{{ .MotorMode.ImageKey }}" alt="Изображение режима {{ .MotorMode.ModeName }}">

            <label class="field">
                <span class="field__label">Ключ видео в Minio</span>
                <input class="field__input" type="text" name="video_key" value="{{ .MotorMode.VideoKey }}">
            </label>
            <video class="draft__preview" muted loop playsinline controls
                   poster="{{ .MediaBaseURL }}/{{ .MotorMode.ImageKey }}">
                <source src="{{ .MediaBaseURL }}/{{ .MotorMode.VideoKey }}" type="video/mp4">
            </video>
        </section>

        <section class="draft__section">
            <h2 class="draft__section-title">Текстовое описание</h2>

            <label class="field">
                <span class="field__label">Название режима</span>
                <input class="field__input" type="text" name="mode_name" value="{{ .MotorMode.ModeName }}">
            </label>

            <label class="field">
                <span class="field__label">Краткое описание</span>
                <textarea class="field__input field__input--textarea" name="short_description" rows="5">{{ .MotorMode.ShortDescription }}</textarea>
            </label>
        </section>

        <section class="draft__section">
            <h2 class="draft__section-title">Параметры режима</h2>

            <label class="field">
                <span class="field__label">Поддержка мотора, %</span>
                <input class="field__input" type="number" name="support_percent" value="{{ .MotorMode.SupportPercent }}">
            </label>

            <label class="field">
                <span class="field__label">Расход батареи, Вт·ч/км</span>
                <input class="field__input" type="number" step="0.1" name="consumption_wh_per_km" value="{{ .MotorMode.ConsumptionWhPerKm }}">
            </label>

            <label class="field">
                <span class="field__label">Максимальный момент, Н·м</span>
                <input class="field__input" type="number" name="max_torque_nm" value="{{ .MotorMode.MaxTorqueNm }}">
            </label>

            <label class="field">
                <span class="field__label">Привод</span>
                <input class="field__input" type="text" name="drive_unit" value="{{ .MotorMode.DriveUnit }}">
            </label>
        </section>

        <button class="button button--primary button--wide" type="button" disabled>
            Сохранение появится во второй лабораторной
        </button>
    </form>
</main>
{{ template "tab_bar" . }}
</body>
</html>
