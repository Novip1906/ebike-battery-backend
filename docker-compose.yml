services:
  minio:
    container_name: ebike_minio_storage
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: rootpassword
      MINIO_CONSOLE_ADDRESS: ":9001"
    volumes:
      - ebike-minio-data:/data
    command: server /data --console-address ":9001"

volumes:
  ebike-minio-data:
