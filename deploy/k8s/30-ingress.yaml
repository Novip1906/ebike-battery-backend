apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  namespace: ebike
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: velo.14dev.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 80
  tls:
    - hosts: ["velo.14dev.ru"]
      secretName: ebike-tls
---
# Медиа Minio отдаются с того же домена по пути /media,
# поэтому отдельный поддомен и второй сертификат не нужны.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: media
  namespace: ebike
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /ebike-motor-media/$2
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
spec:
  ingressClassName: nginx
  rules:
    - host: velo.14dev.ru
      http:
        paths:
          - path: /media(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: minio
                port:
                  number: 9000
