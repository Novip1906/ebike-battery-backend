apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  namespace: ebike
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: ebike.217.149.22.162.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 80
  tls:
    - hosts: ["ebike.217.149.22.162.nip.io"]
      secretName: ebike-tls
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: media
  namespace: ebike
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
spec:
  ingressClassName: nginx
  rules:
    - host: media.ebike.217.149.22.162.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
  tls:
    - hosts: ["media.ebike.217.149.22.162.nip.io"]
      secretName: ebike-media-tls
