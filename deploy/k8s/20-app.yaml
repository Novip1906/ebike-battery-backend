apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: app-bin
  namespace: ebike
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: ebike
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ebike-app
  template:
    metadata:
      labels:
        app: ebike-app
    spec:
      containers:
        - name: app
          image: alpine:3.21
          workingDir: /app
          command: ["/app/server"]
          env:
            - name: MINIO_PUBLIC_URL
              value: https://velo.14dev.ru/media
            - name: GIN_MODE
              value: release
            - name: CURRENT_RIDER_ID
              value: "1"
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_USER
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_PASSWORD
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: postgres-auth
                  key: POSTGRES_DB
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: bin
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /motor-modes
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 300m
              memory: 128Mi
      volumes:
        - name: bin
          persistentVolumeClaim:
            claimName: app-bin
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: ebike
spec:
  selector:
    app: ebike-app
  ports:
    - port: 80
      targetPort: 8080
